services:
  neo4j:
    image: neo4j:2025.09.0-enterprise
    container_name: protein-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASS:-password}
    volumes:
      - neo4j_data:/data
      - ./neo4j/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  web:
    build: .
    container_name: protein-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    command: >
      sh -c "python manage.py migrate &&
             gunicorn proteinapp.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 300"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
